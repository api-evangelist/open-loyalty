alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Open Loyalty
serviceCategory: Marketing and Customer Engagement
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Open Loyalty Cloud
  ServiceCategory: Marketing and Customer Engagement
  ProviderName: Open Loyalty
  PublisherName: Open Loyalty
  InvoiceIssuerName: Open Loyalty
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: monthly_active_members
  description: Registered members performing at least one loyalty event in a calendar month; the primary billing metric.
  unit: members
  aggregation: sum
  dimensions:
  - account
  - store
- name: platform_fee
  description: Recurring platform subscription fee for the managed Open Loyalty Cloud instance.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
- name: self_hosted_compute
  description: Infrastructure cost of running the self-hosted Open Source Edition (no Open Loyalty invoice).
  unit: hours
  aggregation: sum
  dimensions:
  - deployment
principles:
- name: Visibility
  description: Track Monthly Active Members per store and understand which members cross the billable-active threshold each month.
- name: Allocation
  description: Use store codes to map loyalty activity and cost to brands, regions, or business units.
- name: Optimization
  description: Focus program mechanics on genuinely engaged members; for testing, use the self-hosted Open Source Edition rather than paid active-member allowance.
- name: Accountability
  description: Assign an owner for the loyalty program budget and review active-member counts against the plan allowance monthly.
