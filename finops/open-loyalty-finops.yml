description: >-
  FinOps view of Open Loyalty spend. Open Loyalty Cloud is a managed loyalty SaaS
  billed on Monthly Active Members - a Platform Fee plus an Allowance Fee per
  active member - so the dominant cost driver is how many registered members
  actually perform a loyalty event each month rather than raw API call volume.
  The GitHub Open Source Edition carries no vendor invoice but is capped at ~200
  members and shifts cost to your own hosting and operations. Enterprise
  agreements cover negotiated volume, SLAs, and services.
notes: >-
  Cloud per-unit rates are not public; pricing is quoted per project. The main
  optimization lever is active-member hygiene - understanding which members are
  billable-active and structuring the program accordingly. Verify rates with
  Open Loyalty sales during reconciliation.
sources:
- https://www.openloyalty.io/
- https://www.openloyalty.io/technology/loyalty-program-api
