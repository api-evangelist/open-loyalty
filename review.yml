aid: open-loyalty
name: Open Loyalty
review:
  question: Does Open Loyalty expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Open Loyalty's public interface is a
    request/response REST API over HTTPS. Its event/streaming behavior is
    delivered as outbound HTTP webhook callbacks (server-to-endpoint POSTs) for
    events such as customer.registered, transaction.registered, and
    account.available_points_amount_changed - not a bidirectional or server-push
    WebSocket that a client connects to. There is no ws:// or wss:// transport on
    Open Loyalty's own API to model.
findings:
  summary: |
    Open Loyalty does not publish a documented public WebSocket API. Open Loyalty
    is an API-first, headless loyalty and gamification platform whose entire
    surface - members (customers), transactions, points transfers, reward
    campaigns, levels/tiers, and earning rules - is exposed as REST over HTTPS,
    JSON in and out. The API is scoped per store using a storeCode path segment
    (for example /api/<storeCode>/customer). Authentication is a JWT bearer token
    obtained from POST /admin/login_check (admin) or
    POST /<storeCode>/customer/login_check (member), or a permanent X-AUTH-TOKEN
    API token. Asynchronous notification is handled by outbound webhooks (HTTP
    POST callbacks) for customer, transaction, and points/account events. No
    realtime, bidirectional, or streaming WebSocket endpoint is documented.
  openSource: |
    Open Loyalty has open-source heritage: a GitHub Open Source Edition of the
    loyalty engine (Apache-2.0, github.com/OpenLoyalty) is self-hostable but is
    capped at roughly 200 members with no guaranteed performance or scalability
    and is positioned for testing only. Production use is the managed Open Loyalty
    Cloud SaaS (contact-sales, billed on Monthly Active Members), running on AWS
    with EU / APAC / NA data residency. The company states it is SaaS-first: there
    is no supported open-source production/self-host edition beyond the capped
    testing edition.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://<instance>.openloyalty.io/api
      documented: true
      note: Full loyalty REST API, scoped per store via a storeCode path segment. Per-tenant SaaS host.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Outbound HTTP POST callbacks for customer, transaction, and points/account events. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Open Loyalty's REST API reference or webhooks documentation as of the review date.
  endpointsConfirmedRest:
    - POST   /api/admin/login_check
    - POST   /api/{storeCode}/customer/login_check
    - POST   /api/{storeCode}/customer/register
    - GET    /api/{storeCode}/customer
    - GET    /api/{storeCode}/customer/check
    - GET    /api/{storeCode}/customer/{customer}
    - PUT    /api/{storeCode}/customer/{customer}
    - POST   /api/{storeCode}/customer/{customer}/level
    - GET    /api/{storeCode}/admin/customer/{customer}/history
    - GET    /api/{storeCode}/transaction
    - POST   /api/{storeCode}/transaction
    - POST   /api/{storeCode}/transaction/simulate
    - GET    /api/{storeCode}/transaction/{transaction}
    - POST   /api/{storeCode}/customer/transaction/customer/assign
    - GET    /api/{storeCode}/points/transfer
    - POST   /api/{storeCode}/points/transfer/add
    - POST   /api/{storeCode}/points/transfer/spend
    - POST   /api/{storeCode}/customer/points/p2p-transfer
    - POST   /api/{storeCode}/points/transfer/{transfer}/cancel
    - GET    /api/{storeCode}/campaign
    - POST   /api/{storeCode}/campaign
    - GET    /api/{storeCode}/campaign/active
    - GET    /api/{storeCode}/campaign/{campaign}
    - PUT    /api/{storeCode}/campaign/{campaign}
    - POST   /api/{storeCode}/admin/customer/{customer}/campaign/{campaign}/buy
    - GET    /api/{storeCode}/level
    - POST   /api/{storeCode}/level/create
    - GET    /api/{storeCode}/level/{level}
    - PUT    /api/{storeCode}/level/{level}
    - DELETE /api/{storeCode}/level/{level}
    - GET    /api/{storeCode}/level/{level}/customers
    - GET    /api/{storeCode}/earningRule
    - POST   /api/{storeCode}/earningRule
    - GET    /api/{storeCode}/earningRule/{earningRule}
    - PUT    /api/{storeCode}/earningRule/{earningRule}
    - POST   /api/{storeCode}/earningRule/{earningRule}/activate
sources:
  - url: https://docs.openloyalty.io/en/latest/api/
    type: Documentation
    note: REST API reference index; all resources are request/response REST. No WebSocket mentioned.
  - url: https://docs.openloyalty.io/en/latest/api/authorization.html
    type: APIReference
    note: JWT bearer auth via login_check; permanent X-AUTH-TOKEN token. No OAuth2 dance, no WebSocket.
  - url: https://docs.openloyalty.io/en/latest/api/customer.html
    type: APIReference
    note: Member (customer) CRUD, activation, level assignment, history.
  - url: https://docs.openloyalty.io/en/latest/api/transactions.html
    type: APIReference
    note: Transaction register, simulate, list, assign, import.
  - url: https://docs.openloyalty.io/en/latest/api/points_transfers.html
    type: APIReference
    note: Points add/spend/transfer/cancel/activate/expire/block.
  - url: https://docs.openloyalty.io/en/latest/api/campaign.html
    type: APIReference
    note: Reward campaign CRUD, active/available, buy, cashback, coupons.
  - url: https://docs.openloyalty.io/en/latest/api/level.html
    type: APIReference
    note: Level (tier) CRUD and member roster per level.
  - url: https://docs.openloyalty.io/en/latest/api/earning_rule.html
    type: APIReference
    note: Earning rule CRUD, activate, QR-code and geolocation variants.
  - url: https://docs.openloyalty.io/en/latest/api/webhooks.html
    type: Documentation
    note: Outbound HTTP POST webhook callbacks for customer/transaction/account events. Not WebSocket.
  - url: https://github.com/OpenLoyalty
    type: SourceCode
    note: Open Source Edition of the loyalty engine (Apache-2.0), capped at ~200 members, testing only.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Open Loyalty's public API is
    request/response REST scoped per store, with asynchronous notification
    delivered via outbound HTTP webhook callbacks. No AsyncAPI document was
    created because there is no server-push WebSocket transport on Open Loyalty's
    own API to model.
