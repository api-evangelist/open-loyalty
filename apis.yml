apis:
- aid: open-loyalty:open-loyalty-customer-api
  name: Open Loyalty Customer API
  tags:
  - Members
  - Customers
  - Profiles
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.openloyalty.io/en/latest/api/customer.html
  baseURL: https://your-instance.openloyalty.io/api
