aid: open-loyalty
url: https://raw.githubusercontent.com/api-evangelist/open-loyalty/refs/heads/main/apis.yml
name: Open Loyalty
kind: company
description: >-
  Open Loyalty is an API-first, headless loyalty and gamification platform. Every
  loyalty mechanic - members, transactions, points, tiers/levels, earning rules,
  reward campaigns, and analytics - is exposed through a documented REST API, so
  brands assemble custom loyalty experiences on top of Open Loyalty rather than a
  fixed UI. The platform grew from an open-source loyalty engine (still available
  as a GitHub Open Source Edition capped at 200 members for testing) into a
  managed, cloud-hosted SaaS. Requests are JSON over HTTPS, authenticated with a
  JWT bearer token (per-store and admin login) or a permanent API token. The API
  is scoped per store using a storeCode path segment, and change events are
  delivered to consumers via outbound HTTP webhook callbacks.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Loyalty
- Gamification
- Rewards
- Points
- Loyalty Program
- Customer Engagement
- Headless
- API First
